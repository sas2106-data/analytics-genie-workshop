# Modules 1–2 — build the modeled dataset: setup → gold view → certified metric view (serverless)
resources:
  jobs:
    analytics_build:
      name: analytics-build
      max_concurrent_runs: 1
      parameters:
        - { name: catalog,            default: "${var.catalog}" }
        - { name: schema,             default: "${var.schema}" }
        - { name: cases_table,        default: "${var.cases_table}" }
        - { name: customers_table,    default: "${var.customers_table}" }
        - { name: target_schema,      default: "${var.target_schema}" }
        - { name: create_sample_data, default: "${var.create_sample_data}" }
      tasks:
        - task_key: setup
          notebook_task: { notebook_path: ../src/00_setup.py }
        - task_key: gold_view
          depends_on: [ { task_key: setup } ]
          notebook_task: { notebook_path: ../src/01_gold_view.py }
        - task_key: metric_view
          depends_on: [ { task_key: gold_view } ]
          notebook_task: { notebook_path: ../src/02_metric_view.py }
